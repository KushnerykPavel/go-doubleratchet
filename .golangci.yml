version: "2"

linters:
  default: all
  disable:
    # Style — not enforced in a crypto library
    - nlreturn
    - wsl_v5
    - wsl               # deprecated; replaced by wsl_v5
    - godox             # allow TODO during active development
    - exhaustruct       # not requiring every struct field initialized
    - nonamedreturns    # named returns used intentionally in some helpers
    - noinlineerr       # inline if err := ...; err != nil is idiomatic Go
    - varnamelen        # short names like n, rk, ck are idiomatic in crypto
    - ireturn           # SCKAProvider intentionally returns interfaces
    - gochecknoglobals  # sentinel errors (ErrAuthFailure etc.) are package-level vars
    - gochecknoinits    # no init() present, but not enforced
    - depguard          # no import restrictions needed
    - goheader          # no file header requirement
    - testpackage       # internal test files (same package) are intentional
    - paralleltest      # session tests are stateful; parallel corrupts state
    - tparallel         # same reason
    - funlen            # ratchet logic functions are legitimately long
    - cyclop            # covered by gocyclo
    - maintidx          # informational only
    - dupl              # Alice/Bob init patterns are structurally similar by design
    - mnd               # 32-byte key sizes are domain constants, not magic numbers
    - lll               # long lines acceptable in comment blocks
    - wrapcheck         # internal errors don't need external wrapping
    - gosmopolitan      # not an i18n project
    - tagliatelle       # no struct tag naming conventions required
    - musttag           # no JSON marshaling in this library
    - exhaustive        # no enum switches
    - gochecksumtype    # no sum types
    - interfacebloat    # SCKAProvider has 6 methods by design
    - inamedparam       # unnamed interface params acceptable for crypto primitives
    - embeddedstructfieldcheck  # no embedded structs
    - iotamixing        # no iota usage
    - arangolint        # not using arangodb
    - ginkgolinter      # not using ginkgo
    - promlinter        # no prometheus metrics
    - protogetter       # no protobuf
    - rowserrcheck      # no database/sql
    - sqlclosecheck     # no database/sql
    - noctx             # no context.Context in crypto primitives (correct)
    - spancheck         # no OpenTelemetry
    - sloglint          # no slog usage
    - loggercheck       # no logger usage
    - zerologlint       # no zerolog usage
    - nosprintfhostport # no URL construction
    - unqueryvet        # no SQL
    - funcorder         # function ordering is intentional for readability
    - godoclint         # package doc comments managed per-package, not per-file
    - err113            # inline errors acceptable for internal helpers

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    gosec:
      excludes:
        - G401  # AES-CBC is spec-mandated (Signal DR §7), not weak in this context
        - G501  # suppress blanket import check; no weak hash imports present
      confidence: medium

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - commentedOutCode

    gocyclo:
      min-complexity: 20  # ratchet state machines are inherently branchy

    gocognit:
      min-complexity: 30

    nestif:
      min-complexity: 6

    nakedret:
      max-func-lines: 0  # disallow naked returns entirely

    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: empty-block
        - name: superfluous-else
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true  # SCKAProvider methods have required signatures

    staticcheck:
      checks:
        - all

    govet:
      enable-all: true
      disable:
        - shadow  # shadowing checked by revive

    unparam:
      check-exported: false  # exported API signatures are stable

    testifylint:
      enable-all: true

    godot:
      scope: declarations  # exported godoc comments must end with period
      capital: true

    misspell:
      locale: US

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

  exclusions:
    rules:
      # Test files: relax security and complexity checks
      - path: _test\.go
        linters:
          - gosec
          - gocritic
          - gocyclo
          - gocognit
          - nestif
          - errcheck

      # Mock implementations: complexity acceptable
      - path: scka/testing/mock\.go
        linters:
          - gocyclo
          - gocognit

      # Internal crypto: low-level byte manipulation expected
      - path: internal/crypto/
        linters:
          - gocritic

      # Suite package: PKCS7 padding validation is necessarily branchy
      - path: internal/suite/
        linters:
          - gocyclo
          - nestif

      # Public wrapper packages mirror internal implementations; allow same patterns
      - path: "^(suite|crypto|kdf|state)/.*\\.go"
        linters:
          - gocyclo
          - nestif
          - gocritic

      # G115: integer overflow on type conversion — counters are bounded by protocol limits
      - linters:
          - gosec
        text: "G115"

      # KDF_RK_HE, KDF_SCKA_INIT follow cryptographic naming conventions (not Go style)
      - path: "kdf/"
        linters:
          - revive
          - staticcheck

      # Package doc comments: allow any-file placement in multi-file packages
      - linters:
          - godoclint
        text: "package"


      # gocritic mergeParams: verbose param lists improve readability in crypto code
      - path: "internal/state/invariants\\.go"
        linters:
          - gocritic

      # mock: gosec byte conversion from small counters is safe
      - path: "scka/mock\\.go"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/KushnerykPavel/go-doubleratchet
